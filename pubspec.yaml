name: genius_academy_mvp
description: "Genius Academy - IQ and brain training app."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8
  google_mobile_ads: ^6.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    
    - assets/icon/
    - assets/splash/

    - assets/data/

    - assets/data/lessons/logical_reasoning/

    - assets/data/assessment/manifests/
    - assets/data/assessment/questions/logical_reasoning/
    - assets/data/assessment/question_sets/logical_reasoning/statements_conclusions/
    - assets/data/assessment/question_sets/daily_challenge/

    - assets/data/daily_challenges/
    - assets/data/daily_challenges/challenges/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#0A0D4D"
  image: assets/splash/splash_logo.png
  android: true
  ios: false

  android_12:
    color: "#0A0D4D"
    image: assets/splash/splash_logo.png